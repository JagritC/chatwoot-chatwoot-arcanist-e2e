x-chatwoot-build: &chatwoot-build
  context: .
  dockerfile: ./docker/Dockerfile
  args:
    BUNDLE_WITHOUT: ""
    EXECJS_RUNTIME: "Node"
    RAILS_ENV: "development"
    RAILS_SERVE_STATIC_FILES: "false"

x-chatwoot-volumes: &chatwoot-volumes
  - ./:/app:delegated
  - bundle:/gems
  - node_modules:/app/node_modules
  - packs:/app/public/packs
  - cache:/app/tmp/cache

x-chatwoot-env: &chatwoot-env
  ACTIVE_STORAGE_SERVICE: "${ACTIVE_STORAGE_SERVICE:-local}"
  ENABLE_ACCOUNT_SIGNUP: "${ENABLE_ACCOUNT_SIGNUP:-true}"
  FORCE_SSL: "${FORCE_SSL:-false}"
  FRONTEND_URL: "${FRONTEND_URL:-http://127.0.0.1:3000}"
  INSTALLATION_ENV: "${INSTALLATION_ENV:-docker}"
  LOG_LEVEL: "${LOG_LEVEL:-info}"
  MAILER_SENDER_EMAIL: "${MAILER_SENDER_EMAIL:-Chatwoot <accounts@chatwoot.com>}"
  NODE_ENV: "${NODE_ENV:-development}"
  POSTGRES_DATABASE: "${POSTGRES_DATABASE:-chatwoot}"
  POSTGRES_HOST: "${POSTGRES_HOST:-postgres}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
  POSTGRES_USERNAME: "${POSTGRES_USERNAME:-postgres}"
  RAILS_ENV: "${RAILS_ENV:-development}"
  RAILS_LOG_TO_STDOUT: "${RAILS_LOG_TO_STDOUT:-true}"
  REDIS_PASSWORD: "${REDIS_PASSWORD:-redis}"
  REDIS_URL: "${REDIS_URL:-redis://:redis@redis:6379}"
  SECRET_KEY_BASE: "${SECRET_KEY_BASE:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}"
  SMTP_ADDRESS: "${SMTP_ADDRESS:-mailhog}"
  SMTP_PORT: "${SMTP_PORT:-1025}"

services:
  web:
    build: *chatwoot-build
    image: chatwoot-arcanist:development
    tty: true
    stdin_open: true
    volumes: *chatwoot-volumes
    depends_on:
      - postgres
      - redis
      - vite
      - mailhog
    ports:
      - "3000:3000"
    environment:
      <<: *chatwoot-env
      VITE_DEV_SERVER_HOST: "vite"
    entrypoint: docker/entrypoints/rails.sh
    command:
      - sh
      - -lc
      - bundle exec rails db:prepare && bundle exec rails s -p 3000 -b 0.0.0.0

  vite:
    build: *chatwoot-build
    image: chatwoot-arcanist:development
    tty: true
    stdin_open: true
    volumes: *chatwoot-volumes
    ports:
      - "3036:3036"
    environment:
      <<: *chatwoot-env
      VITE_DEV_SERVER_HOST: "0.0.0.0"
    entrypoint: docker/entrypoints/vite.sh
    command:
      - bin/vite
      - dev
      - --host
      - 0.0.0.0

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DATABASE:-chatwoot}"
      POSTGRES_USER: "${POSTGRES_USERNAME:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    volumes:
      - postgres:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - redis-server --requirepass "$$REDIS_PASSWORD"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redis}"
    volumes:
      - redis:/data

  mailhog:
    image: mailhog/mailhog
    restart: unless-stopped

volumes:
  bundle:
  cache:
  node_modules:
  packs:
  postgres:
  redis:
